[project]
name = "printing-rag-bot"
version = "0.1.0"
description = "RAG-based chatbot for a printing consultancy"
requires-python = ">=3.11"

dependencies = [
  "fastapi[standard]",
  "uvicorn[standard]",
  "langchain",
  "langchain-community",
  "chromadb",
  "pydantic>=2.0",
  "python-dotenv",
  "langchain-chroma",
  "langchain-google-genai",
  "langchain-groq",
  "groq",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

